# ─────────────────────────────────────────────────────────────────────────────
#  rf_tuning.toml - random-forest search space for  python ml_model.py --tune-rf
#  (or [ml] tune_rf = true in config.toml).  Randomised search, purged k-fold CV.
#  "none" means Python None.  max_samples = 1.0 means "use every row".
# ─────────────────────────────────────────────────────────────────────────────

[search]
n_iter = 30                 # configurations tried (capped by the size of the grid below)
cv_folds = 5
embargo_pct = 0.02          # rows removed around each test fold (leakage guard)
scoring = "accuracy"        # any scikit-learn scorer, e.g. "balanced_accuracy", "roc_auc", "neg_log_loss"
random_state = 42
n_jobs = 1                  # the forest itself already uses all cores

[params]
n_estimators = [200, 500, 800]
max_depth = ["none", 4, 6, 8, 12]
min_samples_leaf = [1, 2, 5, 10, 20]
max_features = ["sqrt", "log2", 0.3, 0.5]
max_samples = [0.5, 0.7, 0.9, 1.0]
class_weight = ["balanced", "balanced_subsample", "none"]
criterion = ["gini", "entropy"]
ccp_alpha = [0.0, 0.001, 0.005]
